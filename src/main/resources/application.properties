spring.application.name=self.learning

# Connects to a file-based H2 database.
# ~ means your Windows user folder; the data survives application restarts.
spring.datasource.url=jdbc:h2:file:~/h2db/booksdb

# Username used to connect to the database.
spring.datasource.username=sa

# Database password; leaving the value empty means no password
spring.datasource.password=

# JDBC driver class that Java uses to communicate with H2.
spring.datasource.driver-class-name=org.h2.Driver

# Tells Spring that the database type is H2.
spring.jpa.database=H2

# Prints the SQL generated by Hibernate in your application console.
spring.jpa.show-sql=true

# Keeps mapped table and column names without applying Spring's default
# naming conversion, such as converting bookTitle to book_title.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Creates missing tables and updates the schema from your entity mappings
# at startup. Unlike create-drop, it does not drop the schema on shutdown.
spring.jpa.hibernate.ddl-auto=update

# Tells Hibernate to generate SQL using H2's database dialect.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Enables the browser console at http://localhost:8080/h2-console.
spring.h2.console.enabled=true